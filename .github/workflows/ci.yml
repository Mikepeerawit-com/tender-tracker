name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The test seam is route handlers over a real local Postgres, so CI brings the
      # whole Supabase stack up rather than mocking the database.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build
