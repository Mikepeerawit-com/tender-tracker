name: Deployment health

# Ask production whether its schema is the one it was built against.
#
# #40 gave `/api/health` the ability to answer that. This asks it. The fault that ticket
# was written for ran for three weeks not because the answer was unavailable but because
# nobody opened the URL — so the probe needs something that opens it without being asked.
#
# This is the *after* half. `preview-schema.yml` is the before half, asking the same
# question of a pull request's preview so the missing `supabase db push` is caught ahead
# of the merge rather than after it (#44). The reading of the answer is shared: both call
# `.github/scripts/probe-health.sh`, because two copies of a five-way diagnosis drift, and
# the copy that drifts is the one that stops being able to fail.

on:
  deployment_status:
  workflow_dispatch:
  # The backstop, and not a nicety. Two things would otherwise leave this workflow unable
  # to fail: the `environment` filter below silently ceasing to match if Vercel ever
  # renames "Production", and a database that drifts with no deploy at all — a paused
  # project, a rotated key, a migration applied by hand. A deploy-triggered check answers
  # neither. This runs a few minutes after the app's own 01:00 UTC cron, so a failure here
  # and a failure there point at the same morning.
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The script only, and only the trusted copy of it. Production deploys come
          # from the default branch anyway, but pinning says so rather than relying on it.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Ask production about its schema
        env:
          PROBE_TARGET: production
          # The public production alias, deliberately **not**
          # `github.event.deployment_status.environment_url`.
          #
          # Vercel reports the immutable deployment URL there — `tender-tracker-<hash>`
          # `.vercel.app` — even for a production deployment, and every one of those sits
          # behind Deployment Protection and answers a redirect to SSO. The first version
          # of this workflow probed it, got the redirect, and reported success having
          # checked nothing: a check that could not fail, shipped into the ticket about
          # checks that cannot fail. It found itself out on its first production run.
          #
          # A preview has no such constant and must use the field; that is the amendment
          # in docs/adr/0016-a-check-must-be-able-to-fail.md, and it is about which input
          # exists, never about a redirect being ignorable.
          HEALTH_ORIGIN: https://tenders.mikepeerawit.com
        run: .github/scripts/probe-health.sh
